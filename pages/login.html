<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | KAYA</title>
    <link rel="icon" type="image/png" href="assets/images/KAYA app.png">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

    <div class="auth-page">

        <div class="auth-brand">
            <a href="../index.html" class="logo">
                KA<span>YA</span>
            </a>
            <p>Where skills meet opportunity.</p>
        </div>

        <div class="auth-card">

            <div class="auth-header">
                <span class="auth-label">WELCOME BACK</span>
                <h1>Log in</h1>
                <p>Access your KAYA account.</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input type="email" id="email" class="form-input" placeholder="name@example.com" required />
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input type="password" id="password" class="form-input" placeholder="••••••••" required />
                </div>

                <button type="submit" class="btn btn-primary btn-full">Log In</button>
            </form>

            <p class="auth-footer">
                Don't have an account?
                <a href="register.html">Create one</a>
            </p>

        </div>

    </div>

    <!-- 1. Enforce RBAC & Session Check on Page Load -->
    <script type="module" src="../js/app.js"></script>

    <!-- 2. Form Submission Logic -->
    <script type="module">
        import { loginUser } from '../js/auth.js';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = e.target.email.value;
            const password = e.target.password.value;
            await loginUser(email, password);
        });
    </script>
</body>

</html>
